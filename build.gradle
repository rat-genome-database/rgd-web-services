plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '3.1.4'
	id 'io.spring.dependency-management' version '1.1.3'
}

group = 'edu.mcw.rgd'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation fileTree(dir: 'lib', include: '*.jar')

	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.2.0'

	// https://mvnrepository.com/artifact/com.oracle.database.jdbc/ojdbc11
	implementation 'com.oracle.database.jdbc:ojdbc11:23.3.0.23.09'
// https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-jdbc
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-jdbc', version: '3.1.4'
// https://mvnrepository.com/artifact/org.apache.commons/commons-dbcp2
	implementation group: 'org.apache.commons', name: 'commons-dbcp2', version: '2.10.0'
	implementation 'org.apache.commons:commons-collections4:4.4'
	implementation 'org.apache.httpcomponents:httpclient:4.5.13'
	implementation 'org.apache.commons:commons-math3:3.6.1'
	implementation 'commons-net:commons-net:3.6'
	implementation 'org.apache.logging.log4j:log4j-api:2.25.4'
	implementation 'org.apache.logging.log4j:log4j-core:2.25.4'
	implementation 'com.fasterxml.jackson.core:jackson-core:2.21.1'
	implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.1'
	// Elasticsearch java client (matches version bundled with rgdcore) for querying the expression index.
	// The low-level rest-client is a separate artifact (pluggable transport) and must be declared explicitly.
	implementation 'co.elastic.clients:elasticsearch-java:9.4.0'
	implementation 'org.elasticsearch.client:elasticsearch-rest-client:9.4.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}
task update_rgdcore(type:Copy){
	from file("../rgd-core-library/dist/rgdcore_1.1.3.jar")
	into file("lib/")
}